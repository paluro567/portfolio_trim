[project]
name = "mip"
version = "0.1.0"
description = "Market Intelligence Platform — data platform for explainable quantitative portfolio research"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "exchange-calendars>=4.13.2",
    "yfinance>=1.5.1",
    "pandas>=3.0.3",
    "fredapi>=0.5.2",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "black>=24.4",
]

[project.scripts]
mip = "mip.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# B008: `typer.Option(...)` in parameter defaults is the Typer API idiom.
"src/mip/cli/*" = ["B008"]
# F811: pytest fixtures imported from another test module are "shadowed"
# by the test parameters that request them — that's how fixtures work.
"tests/integration/test_research_engine.py" = ["F811"]
"tests/integration/test_intelligence_rates.py" = ["F811"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable PostgreSQL (MIP_TEST_DATABASE_URL)",
]
